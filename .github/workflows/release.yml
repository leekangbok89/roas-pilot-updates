
name: ROAS Pilot Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '배포 버전 (예: v2.8.0-test1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r roas-pilot.zip \
            package.json server.js \
            START_ROAS_PILOT.bat public

      - name: Publish test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            roas-pilot.zip \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --prerelease \
            --generate-notes
