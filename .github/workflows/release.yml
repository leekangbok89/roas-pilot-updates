
name: ROAS Pilot Release

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/release.yml'
      - 'tests/**'
      - 'scripts/**'
      - 'integrations/ga4/**'
      - 'integrations/ad-changes/**'
      - 'integrations/naver-search/**'
      - 'integrations/coupang/**'
      - 'integrations/gfa/**'
      - 'integrations/monitoring/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (example: v2.8.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: roas-pilot-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          VERSION="${INPUT_VERSION:-v$PACKAGE_VERSION}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${VERSION#v}" == "$PACKAGE_VERSION" ]] || { echo "Package version mismatch"; exit 1; }
          grep -Fq "const appVersion='$PACKAGE_VERSION'" server.js || { echo "Server version mismatch"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate Node.js code and bundled bcrypt
        run: |
          node scripts/bundle-gfa.cjs --check
          node --check public/gfa-data.js
          node --check public/gfa-analysis.js
          node scripts/bundle-shell.cjs --check
          node scripts/bundle-ga4.cjs --check
          node scripts/bundle-ad-changes.cjs --check
          node --check public/ad-changes.js
          node scripts/bundle-naver-search.cjs --check
          node --check public/naver-search.js
          node scripts/bundle-monitoring.cjs --check
          node --check public/daily-monitoring.js
          node --check public/monitoring-import.js
          node scripts/bundle-coupang.cjs --check
          node --check public/coupang.js
          node scripts/bundle-experiments.cjs --check
          node --check server.js
          node --check public/app.js
          node --check public/naver-analysis.js
          node --check public/app-shell.js
          node --check public/naver-settings.js
          node --check public/ga4.js
          node --check public/detail-analysis.js
          node --check public/detail-tracker.js
          node scripts/check-inline-scripts.js
          npm test
          node -e "const m=require('./server'); if(!m.server)process.exit(1)"
          node -e 'const b=require("./vendor/bcrypt.min.js"); const h=b.hashSync("test_password","$2a$04$abcdefghijklmnopqrstuv"); if(!b.compareSync("test_password",h))process.exit(1)'

      - name: Prepare browser verification library
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/roas-ui-tests" --no-audit --no-fund --ignore-scripts --package-lock=false playwright@1.56.1

      - name: Verify profit, recovery, GA4, navigation, and legacy upgrades in Chromium
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export BROWSER_EXECUTABLE="$(command -v chromium)"
          else
            "$RUNNER_TEMP/roas-ui-tests/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          fi
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-profit-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-shell-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-ga4-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-detail-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-ad-changes-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-naver-search-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-coupang-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-growth-mode.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-coupang-daily-report.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-coupang-history.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-coupang-collector.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-naver-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-other-ad-costs-browser.cjs
          ROAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/roas-ui-tests/node_modules/playwright" node scripts/smoke-gfa-browser.cjs

      - name: Package ROAS Pilot
        run: |
          zip -r roas-pilot.zip \
            package.json server.js \
            START_ROAS_PILOT.bat public vendor

      - name: Create manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          SHA=$(sha256sum roas-pilot.zip | cut -d' ' -f1)
          VERSION_NUMBER="${VERSION#v}"
          URL="https://github.com/$REPO/releases/download/$VERSION/roas-pilot.zip"

          printf '{"version":"%s","url":"%s","sha256":"%s"}\n' \
            "$VERSION_NUMBER" "$URL" "$SHA" > manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release already exists: $VERSION"; exit 1; fi
          gh release create "$VERSION" \
            roas-pilot.zip manifest.json \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

      - name: Update manifest on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp manifest.json "$RUNNER_TEMP/roas-pilot-manifest.json"
          git restore --worktree manifest.json
          git fetch origin main
          git checkout -B main origin/main
          if [[ "$(node -p "require('./package.json').version")" != "${VERSION#v}" ]]; then
            echo "Newer source version is on main; skip publishing an older manifest."
            exit 0
          fi
          cp "$RUNNER_TEMP/roas-pilot-manifest.json" manifest.json
          git add manifest.json
          git commit -m "Update release manifest" || exit 0
          git push origin main


