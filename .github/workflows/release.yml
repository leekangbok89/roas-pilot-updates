
name: ROAS Pilot Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (example: v2.8.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Package ROAS Pilot
        run: |
          zip -r roas-pilot.zip \
            package.json server.js \
            START_ROAS_PILOT.bat public

      - name: Create manifest
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(sha256sum roas-pilot.zip | cut -d' ' -f1)
          VERSION_NUMBER="${VERSION#v}"
          URL="https://github.com/$REPO/releases/download/$VERSION/roas-pilot.zip"

          printf '{"version":"%s","url":"%s","sha256":"%s"}\n' \
            "$VERSION_NUMBER" "$URL" "$SHA" > manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            roas-pilot.zip manifest.json \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

      - name: Update manifest on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp manifest.json manifest.tmp
          mv manifest.tmp manifest.json
          git add manifest.json
          git commit -m "Update release manifest" || exit 0
          git push origin main
