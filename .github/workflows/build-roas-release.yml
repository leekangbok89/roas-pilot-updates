name: Build ROAS Pilot release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test -f public/visual-overview.html
          test -f public/cost-management.html
          grep -q "id=\"budget-efficiency\"" public/visual-overview.html
          grep -q "const appVersion='$VERSION'" server.js
          node --check server.js
          node --check public/app.js
          npm test
      - name: Build, release, publish manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          zip -q roas-pilot.zip server.js package.json public/index.html public/app.js public/styles.css public/visual-overview.html public/cost-management.html
          SUM=$(sha256sum roas-pilot.zip | cut -d' ' -f1)
          gh release create "$TAG" roas-pilot.zip --title "ROAS Pilot $TAG" --notes "원가관리 메뉴 및 판매옵션별 원가 저장, 일별 그래프 3·5·7일 이동평균"
          node -e "require('fs').writeFileSync('manifest.json', JSON.stringify({version:process.argv[1],url:'https://github.com/leekangbok89/roas-pilot-updates/releases/download/v'+process.argv[1]+'/roas-pilot.zip',sha256:process.argv[2]},null,2)+'\\n')" "$VERSION" "$SUM"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish ROAS Pilot $TAG manifest"
          git push
