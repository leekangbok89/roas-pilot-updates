<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>body{font:14px system-ui;width:350px;padding:14px;line-height:1.6}label{display:block;margin:8px 0}button{padding:8px;margin:4px 0}input{max-width:170px}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h2>쿠팡 광고 수집 연결</h2><p>시험 연결 · 광고센터에 직접 로그인하세요. 차단·인증 화면에서는 수집을 중단합니다.</p><label>시작일 <input id="since" type="date"></label><label>종료일 <input id="until" type="date"></label><button id="year">최근 1년</button><button id="week">최근 7일</button><label><input id="automatic" type="checkbox" checked> 완료 후 매일 최근 7일 재확인</label><p>전체 캠페인의 일별 보고서를 만듭니다. 과거 조회 가능 범위와 화면 동작은 실제 사이트에서 확인해야 합니다.</p><button id="start">로그인 화면 열고 수집 시작</button><button id="stop">수집 중단</button><button id="permission" hidden>보고서 다운로드 서버 접근 허용</button><pre id="status"></pre><script src="popup.js"></script></body></html>
